# Generates Tuner.xcodeproj: `xcodegen generate`. The .xcodeproj is a build artifact and is gitignored.
name: Tuner
options:
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Debug.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 224XVWZLBK
    # Change this one value to move every bundle ID (app, widgets, app group) to a namespace you own.
    TUNER_BUNDLE_PREFIX: com.cillianpower.tuner
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  TunerKit:
    path: TunerKit
targets:
  Tuner-iOS:
    type: application
    platform: iOS
    sources:
      - Apps/Shared
      - Apps/iOS
    dependencies:
      - package: TunerKit
        product: TunerUI
    settings:
      base:
        PRODUCT_NAME: Tuner
        PRODUCT_BUNDLE_IDENTIFIER: $(TUNER_BUNDLE_PREFIX)
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # Declared as properties: XcodeGen rewrites the file from these on every `generate`.
    entitlements:
      path: Apps/iOS/Tuner.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.$(TUNER_BUNDLE_PREFIX)]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(TUNER_BUNDLE_PREFIX)
        keychain-access-groups: [$(AppIdentifierPrefix)$(TUNER_BUNDLE_PREFIX)]
        # CKSyncEngine is woken by silent pushes when another device changes something.
        aps-environment: development
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Tuner
        TunerCloudKitContainer: iCloud.$(TUNER_BUNDLE_PREFIX)
        TunerDevServerURL: $(TUNER_DEV_SERVER_URL)
        UILaunchScreen: {}
        UIBackgroundModes: [audio, remote-notification]
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Personal servers and many radio streams are plain HTTP on the LAN.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Tuner connects to your music server and to Tuner on your other devices over your local network.
        NSBonjourServices: [_tuner._tcp]
  Tuner-macOS:
    type: application
    platform: macOS
    sources:
      - Apps/Shared
      - Apps/macOS
    dependencies:
      - package: TunerKit
        product: TunerUI
    # Restricted iCloud entitlements need a provisioning profile (Xcode automatic signing). For an
    # ad-hoc CLI build, pass an ABSOLUTE path (a relative one is resolved per package target):
    #   CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS="$PWD/Apps/macOS/Tuner-Local.entitlements"
    # (sandbox + network only); sync then reports "unavailable" instead of the build failing.
    entitlements:
      path: Apps/macOS/Tuner.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.$(TUNER_BUNDLE_PREFIX)]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(TUNER_BUNDLE_PREFIX)
        keychain-access-groups: [$(AppIdentifierPrefix)$(TUNER_BUNDLE_PREFIX)]
        com.apple.developer.aps-environment: development
    settings:
      base:
        PRODUCT_NAME: Tuner
        PRODUCT_BUNDLE_IDENTIFIER: $(TUNER_BUNDLE_PREFIX)
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: Tuner
        TunerCloudKitContainer: iCloud.$(TUNER_BUNDLE_PREFIX)
        TunerDevServerURL: $(TUNER_DEV_SERVER_URL)
        LSApplicationCategoryType: public.app-category.music
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Tuner connects to your music server and to Tuner on your other devices over your local network.
        NSBonjourServices: [_tuner._tcp]
schemes:
  Tuner-iOS:
    build:
      targets: { Tuner-iOS: all }
  Tuner-macOS:
    build:
      targets: { Tuner-macOS: all }
