# Generates Stereo.xcodeproj: `xcodegen generate`. The .xcodeproj is a build artifact and is gitignored.
name: Stereo
options:
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Debug.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 224XVWZLBK
    # Change this one value to move every bundle ID (app, widgets, app group) to a namespace you own.
    STEREO_BUNDLE_PREFIX: com.cillianpower.stereo
    # Shared by the apps and their widget extensions (the widget snapshot lives here).
    STEREO_APP_GROUP: group.$(STEREO_BUNDLE_PREFIX)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  StereoKit:
    path: StereoKit
targets:
  Stereo-iOS:
    type: application
    platform: iOS
    sources:
      - Apps/Shared
      - Apps/WidgetIntents
      - Apps/iOS
      - path: Icon/Stereo.icon
        buildPhase: resources
    dependencies:
      - package: StereoKit
        product: StereoUI
      - target: StereoWidgets-iOS
    settings:
      base:
        PRODUCT_NAME: Stereo
        PRODUCT_BUNDLE_IDENTIFIER: $(STEREO_BUNDLE_PREFIX)
        # Icon/Stereo.icon (Icon Composer), generated by scripts/make-icon.py. Set per target:
        # XcodeGen's application preset would otherwise name an "AppIcon" set that doesn't exist.
        ASSETCATALOG_COMPILER_APPICON_NAME: Stereo
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # Declared as properties: XcodeGen rewrites the file from these on every `generate`.
    entitlements:
      path: Apps/iOS/Stereo.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.$(STEREO_BUNDLE_PREFIX)]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(STEREO_BUNDLE_PREFIX)
        keychain-access-groups: [$(AppIdentifierPrefix)$(STEREO_BUNDLE_PREFIX)]
        com.apple.security.application-groups: [$(STEREO_APP_GROUP)]
        # CKSyncEngine is woken by silent pushes when another device changes something.
        aps-environment: development
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Stereo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        StereoCloudKitContainer: iCloud.$(STEREO_BUNDLE_PREFIX)
        StereoAppGroup: $(STEREO_APP_GROUP)
        StereoDevServerURL: $(STEREO_DEV_SERVER_URL)
        UILaunchScreen: {}
        UIBackgroundModes: [audio, remote-notification]
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Personal servers and many radio streams are plain HTTP on the LAN.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Stereo connects to your music server and to Stereo on your other devices over your local network.
        NSBonjourServices: [_stereo._tcp]
  Stereo-macOS:
    type: application
    platform: macOS
    sources:
      - Apps/Shared
      - Apps/WidgetIntents
      - Apps/macOS
      - path: Icon/Stereo.icon
        buildPhase: resources
    dependencies:
      - package: StereoKit
        product: StereoUI
      - target: StereoWidgets-macOS
    # Restricted iCloud entitlements need a provisioning profile (Xcode automatic signing). For an
    # ad-hoc CLI build, pass an ABSOLUTE path (a relative one is resolved per package target):
    #   CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS="$PWD/Apps/macOS/Stereo-Local.entitlements"
    # (sandbox + network only); sync then reports "unavailable" instead of the build failing.
    entitlements:
      path: Apps/macOS/Stereo.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.$(STEREO_BUNDLE_PREFIX)]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(STEREO_BUNDLE_PREFIX)
        keychain-access-groups: [$(AppIdentifierPrefix)$(STEREO_BUNDLE_PREFIX)]
        com.apple.security.application-groups: [$(STEREO_APP_GROUP)]
        com.apple.developer.aps-environment: development
    settings:
      base:
        PRODUCT_NAME: Stereo
        PRODUCT_BUNDLE_IDENTIFIER: $(STEREO_BUNDLE_PREFIX)
        # Icon/Stereo.icon (Icon Composer), generated by scripts/make-icon.py. Set per target:
        # XcodeGen's application preset would otherwise name an "AppIcon" set that doesn't exist.
        ASSETCATALOG_COMPILER_APPICON_NAME: Stereo
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: Stereo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        StereoCloudKitContainer: iCloud.$(STEREO_BUNDLE_PREFIX)
        StereoAppGroup: $(STEREO_APP_GROUP)
        StereoDevServerURL: $(STEREO_DEV_SERVER_URL)
        LSApplicationCategoryType: public.app-category.music
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Stereo connects to your music server and to Stereo on your other devices over your local network.
        NSBonjourServices: [_stereo._tcp]
  StereoWidgets-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/Widgets
        excludes: ["*.plist", "*.entitlements"]
      - Apps/WidgetIntents
    dependencies:
      - package: StereoKit
        product: StereoWidgetData
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: StereoWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(STEREO_BUNDLE_PREFIX).widgets
        # Swaps WidgetIntents' perform() bodies for stubs; the real ones run in the app.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        SKIP_INSTALL: YES
    entitlements:
      path: Apps/Widgets/StereoWidgets-iOS.entitlements
      properties:
        com.apple.security.application-groups: [$(STEREO_APP_GROUP)]
    info:
      path: Apps/Widgets/Info-iOS.plist
      properties:
        CFBundleDisplayName: Stereo
        StereoAppGroup: $(STEREO_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  StereoWidgets-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: Apps/Widgets
        excludes: ["*.plist", "*.entitlements"]
      - Apps/WidgetIntents
    dependencies:
      - package: StereoKit
        product: StereoWidgetData
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: StereoWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(STEREO_BUNDLE_PREFIX).widgets
        # Swaps WidgetIntents' perform() bodies for stubs; the real ones run in the app.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        SKIP_INSTALL: YES
    entitlements:
      path: Apps/Widgets/StereoWidgets-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(STEREO_APP_GROUP)]
    info:
      path: Apps/Widgets/Info-macOS.plist
      properties:
        CFBundleDisplayName: Stereo
        StereoAppGroup: $(STEREO_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Stereo-iOS:
    build:
      targets: { Stereo-iOS: all }
  Stereo-macOS:
    build:
      targets: { Stereo-macOS: all }
